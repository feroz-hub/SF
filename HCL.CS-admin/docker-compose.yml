version: '3.9'

services:
  identity-api:
    build:
      context: ..
      dockerfile: docker/identity-api.Dockerfile
    image: hcl-cs/identity-api:local
    ports:
      - '8080:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  admin-api:
    build:
      context: ..
      dockerfile: docker/admin-api.Dockerfile
    image: hcl-cs/admin-api:local
    ports:
      - '8081:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    image: hcl-cs/gateway:local
    command: ["dotnet", "--info"]

  hcl-cs-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: hcl-cs/hcl-cs-admin:local
    ports:
      - '3000:3000'
    depends_on:
      - identity-api
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-replace-with-long-random-secret}
      HCL_CS_ISSUER: ${HCL_CS_ISSUER:-https://localhost:5001}
      HCL_CS_CLIENT_ID: ${HCL_CS_CLIENT_ID:-}
      HCL_CS_CLIENT_SECRET: ${HCL_CS_CLIENT_SECRET:-}
      HCL_CS_API_BASE_URL: ${HCL_CS_API_BASE_URL:-https://localhost:5001}
      HCL_CS_SCOPES: ${HCL_CS_SCOPES:-openid profile email offline_access phone hcl-cs.apiresource hcl-cs.client hcl-cs.user hcl-cs.role hcl-cs.identityresource hcl-cs.adminuser hcl-cs.securitytoken}
      HCL_CS_POST_LOGOUT_REDIRECT_URI: ${HCL_CS_POST_LOGOUT_REDIRECT_URI:-https://localhost:3000/login}
      HCL_CS_ALLOW_INSECURE_TLS: ${HCL_CS_ALLOW_INSECURE_TLS:-false}
